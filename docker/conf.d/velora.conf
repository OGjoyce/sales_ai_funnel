# HTTP redirect to HTTPS
server {
    listen 80;
    server_name velora.guatemalia.com www.velora.guatemalia.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name velora.guatemalia.com www.velora.guatemalia.com;

    # Docker DNS resolver for dynamic service discovery
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    ssl_certificate /etc/letsencrypt/live/velora.guatemalia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velora.guatemalia.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    root /app/public;
    index index.php index.html;

    # OpenClaw Control UI — keep /openclaw prefix (gateway.controlUi.basePath=/openclaw)
    location ^~ /openclaw/ {
        set $openclaw_upstream "http://openclaw:18789";
        proxy_pass $openclaw_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /openclaw;
        # sub_filter needs uncompressed upstream body
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        # Relative ./assets/ breaks when the page URL is /openclaw (no trailing slash)
        sub_filter '<head>' '<head><base href="/openclaw/">';
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Support WebSocket clients that connect to /openclaw (without trailing slash)
    location = /openclaw {
        return 301 $scheme://$host/openclaw/;
    }

    # Static files with caching (Laravel public only; not /openclaw)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API and dynamic content
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        set $backend "app:9000";
        fastcgi_pass $backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    error_log /var/log/nginx/velora_error.log;
    access_log /var/log/nginx/velora_access.log main;
}
